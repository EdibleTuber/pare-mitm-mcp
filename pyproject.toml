[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pare-mitm-mcp"
version = "0.1.0"
description = "HTTPS traffic (mitmproxy) MCP worker for PARE"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=11.0.0",
    "mcp>=1.27.0,<2",   # agent_core targets mcp 1.x; 2.0 renamed streamablehttp_client
    "pare-worker-kit @ git+https://github.com/EdibleTuber/pare-worker-kit.git@v0.1.0",   # RISK_TIER_META_KEY + run_worker; mcp-only, so a Pi stays small
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
pare-mitm-mcp = "pare_mitm_mcp.server:main"
pare-mitm-daemon = "pare_mitm_mcp.daemon.launcher:main"

[tool.hatch.metadata]
# Required for the pare-worker-kit git dependency above. Without it,
# hatchling refuses ANY direct URL reference and the package cannot be
# installed at all -- not "installs with a warning", but a hard
# metadata-generation failure on a clean checkout.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pare_mitm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
